    provider: Anthropic
    claude_code_version: "2.1.209"
    agent_sdk_version: "0.3.212"
    intended_role: "candidate benchmark-execution model (also the development-harness model on the reference machine; development use is NOT experimental evidence)"
    model_selection_status: "candidate - not selected as primary (TD-B03; screened incl C1/C3/C4; never selected on AFCI effect; D10)"
    effort_input: "--effort flag (log as input metadata); not recordable from output (dry-run-required Q4)"
    thinking_control_status: "not pinnable/recordable; adaptive under effort; not a factor"
    workflow_control_status: "disable via CLAUDE_CODE_DISABLE_WORKFLOWS=1"
    evidence_classification: "id doc-derived; opus[1m] resolution transcript; CLI CLI-verified; SDK env-observed"
    dry_run_validation_status: "pending - no paid run executed"

  - model_label: "Sonnet 5"
    exact_model_id: "claude-sonnet-5"
    context_variant_id: null
    alias_status: "alias 'sonnet' maps to this exact id (doc-derived); pin the exact id"
    provider: Anthropic
    claude_code_version: "2.1.209"
    agent_sdk_version: "0.3.212"
    intended_role: "candidate benchmark-execution model (selection pending)"
    model_selection_status: "candidate - not selected as primary (TD-B03; screened incl C1/C3/C4; never selected on AFCI effect; D10)"
    effort_input: "--effort flag (log as input metadata); not recordable from output (dry-run-required Q4)"
    thinking_control_status: "not pinnable/recordable; not a factor"
    workflow_control_status: "disable via CLAUDE_CODE_DISABLE_WORKFLOWS=1"
    evidence_classification: "id doc-derived; CLI CLI-verified; SDK env-observed; exact id now RUNTIME-VERIFIED by Q1 readback on CLI 2.1.229"
    dry_run_validation_status: "pending for the confirmatory pilot - Q1/Q8 validated live on CLI 2.1.229 for PT08_DIFFICULTY_DIAGNOSTIC only (SL-PT08-05); no benchmark condition executed and no result produced"

  - model_label: "Haiku 4.5"
    exact_model_id: "claude-haiku-4-5-20251001"
    context_variant_id: null
    alias_status: "dated exact id; RUNTIME-VERIFIED - the runtime resolved this exact id when it was requested by name"
    provider: Anthropic
    claude_code_version: "2.1.209"
    agent_sdk_version: "0.3.212"
    intended_role: "candidate low-cost / secondary generalizability model (not a primary candidate); the lower-capability arm of the AFCI_LOWER_MODEL_PILOT"
    model_selection_status: "candidate - not selected as primary (TD-B03; screened incl C1/C3/C4; never selected on AFCI effect; D10)"
    effort_input: "--effort flag (log as input metadata)"
    thinking_control_status: "not pinnable/recordable; not a factor"
    workflow_control_status: "disable via CLAUDE_CODE_DISABLE_WORKFLOWS=1"
    evidence_classification: "id doc-derived; strongest Haiku id in the installed runtime by read-only binary enumeration; CLI CLI-verified; SDK env-observed; exact id now RUNTIME-VERIFIED by Q1 readback on CLI 2.1.229"
    dry_run_validation_status: "pending for the confirmatory pilot - Q1 validated live on CLI 2.1.229 for AFCI_LOWER_MODEL_PILOT only (SL-V2-LOWER-MODEL-01), Q8 cited from SL-PT08-05; no benchmark condition executed and no result produced"

  - model_label: "Fable 5"
