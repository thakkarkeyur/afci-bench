# AFCI-Bench v2 — Model Registry
#
# Status: development artifact for study v2. Records ONLY verified or explicitly
# evidence-tagged information about candidate models and their execution
# controls. It does NOT freeze the final benchmark configuration, it does NOT
# select a primary model, and NO paid model run was performed to produce it.
#
# Evidence tags (same scheme as MODEL_EXECUTION_CONTROLS.md):
#   CLI-verified  - confirmed from `claude --version` / `claude --help` on CLI 2.1.209
#   env-observed  - read from the reference machine environment
#   transcript    - seen in a real workflow transcript already on disk
#   doc-derived   - from Anthropic / Claude Code docs (not version-pinned to 2.1.x)
#   dry-run-required - a runtime claim NOT yet validated by a controlled run
#
# Companion table: MODEL_REGISTRY.csv (kept in step with this file; a test
# asserts the two agree). Control details: MODEL_EXECUTION_CONTROLS.md +
# MODEL_CONFIGURATION_MATRIX.csv.

registry_version: "1.1.0"
status: development

# WAS true. Live runtime CONTROL probes have since been executed under
# SL-PT08-04/SL-PT08-05: the Q1 resolved-model-id readback, the Q8
# invalid-model-id rejection, and the context audit that authenticates in order
# to observe what the runtime loads. Those are runtime controls, not benchmark
# runs: no benchmark condition was executed, nothing was scored, and no result,
# violation value or success value exists. The flag is corrected rather than
# reinterpreted, because "no paid run" is now a false statement.
no_paid_run: false
paid_activity_to_date: "runtime control probes only (Q1, Q8, context audit); no benchmark condition executed; no result produced"

toolchain:
  claude_code_cli_version: "2.1.209"          # CLI-verified (claude --version)
  host_ide_extension_version: "2.1.212"       # env-observed (interactive UI build; not used for runs)
  claude_agent_sdk_version: "0.3.212"         # env-observed (CLAUDE_AGENT_SDK_VERSION)
  provider: Anthropic

# The primary benchmark model is DELIBERATELY NOT SELECTED in this work package.
primary_model: null                            # OPEN DECISION TD-B03 (blocking)
primary_model_selection_status: "not selected - blocked on dry-run validation (TD-B03); do not select Sonnet or Opus yet"

# ---------------------------------------------------------------------------
# SL-PT08-05 - model and runtime pinned for ONE non-confirmatory run purpose.
#
# This is NOT the primary-model selection TD-B03 governs. TD-B03 selects the
# model of the CONFIRMATORY study, after screening across C1/C3/C4 and subject
# to the rule that the choice is never made on the largest favourable effect;
# that decision stays OPEN and primary_model stays null above.
#
# TD-B03 also says "do not select Sonnet or Opus yet". That instruction is about
# the confirmatory selection, and it is NOT discharged, weakened or pre-empted
# here: pinning a model so a quarantined difficulty probe can execute at all
# creates no screening evidence, no comparison and no precedent, and the
# confirmatory selection remains entirely open. The tension is recorded rather
# than resolved, because resolving it is not this record's to make.
#
# The runner reads this block ONLY for the run purpose named in it.
# ---------------------------------------------------------------------------
diagnostic_model_selection:
  PT08_DIFFICULTY_DIAGNOSTIC:
    decision_id: "SL-PT08-05"
    primary_model_family: "Claude Sonnet"
    requested_selector: "sonnet"                # what Q1 asked for
    exact_model_id: "claude-sonnet-5"           # what the runtime resolved
    selector_used_for_repetitions: "claude-sonnet-5"   # the exact id, never the alias
    q1_readback: "PASS"
    q1_readback_sources: ["system.init.model", "modelUsage"]
    q1_unambiguous: true
    q8_invalid_model_id_rejection: "PASS"
    q8_invalid_model_id: "claude-nonexistent-model-9x7q-not-a-real-id"
    q8_evidence: "exit status 1; modelUsage empty; no other model reported; assistant turn synthetic"
    sterile_context_validation: "PASS"
    api_key_used: false
    authentication: "claude-code-subscription-oauth (apiKeySource=none)"
    fallback_model: "none; --fallback-model is refused by the launcher"
    permission_mode: "acceptEdits"
    tools: ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]
    repetitions: 3
    # The runtime version actually validated on this machine. It is NOT the
    # governed toolchain value above, and the difference is recorded rather
    # than reconciled: see SL-PT08-05 for the discrepancy.
    validated_claude_code_cli_version: "2.1.229"
    governed_toolchain_cli_version: "2.1.209"
    cli_version_discrepancy: "UNRESOLVED - the governed toolchain value predates this machine's installed runtime; no version match is claimed"
    confers_no_primary_selection: true
    confers_no_confirmatory_eligibility: true
    td_b03_status: "open; unchanged by this pin"

  # SL-V2-QUAL-01 - the PT09/PT10 C1 instrument-qualification diagnostic REUSES
  # the configuration SL-PT08-05 already live-validated, rather than selecting a
  # fresh one. The Q1 readback and the Q8 invalid-model-id rejection below are
  # the SAME validation events SL-PT08-05 recorded, on the same machine, the same
  # runtime and the same exact model id; they are CITED here so the runner can
  # re-derive them for this purpose, and they are NOT re-performed and NOT a
  # second, independent validation. The exact model readback is still checked on
  # every individual observation, which is where it actually protects anything.
  #
  # Like the block above, this confers NO primary selection: TD-B03 stays open
  # and primary_model stays null.
  INSTRUMENT_QUALIFICATION_DIAGNOSTIC:
    decision_id: "SL-V2-QUAL-01"
    primary_model_family: "Claude Sonnet"
    requested_selector: "sonnet"                # what Q1 asked for
    exact_model_id: "claude-sonnet-5"           # what the runtime resolved
    selector_used_for_repetitions: "claude-sonnet-5"   # the exact id, never the alias
    q1_readback: "PASS"
    q1_readback_sources: ["system.init.model", "modelUsage"]
    q1_unambiguous: true
    q1_validation_provenance: "SL-PT08-05; cited, not re-performed"
    q8_invalid_model_id_rejection: "PASS"
    q8_invalid_model_id: "claude-nonexistent-model-9x7q-not-a-real-id"
    q8_evidence: "exit status 1; modelUsage empty; no other model reported; assistant turn synthetic"
    q8_validation_provenance: "SL-PT08-05; cited, not re-performed"
    sterile_context_validation: "PASS"
    api_key_used: false
    authentication: "claude-code-subscription-oauth (apiKeySource=none)"
    fallback_model: "none; --fallback-model is refused by the launcher"
    permission_mode: "acceptEdits"
    tools: ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]
    repetitions: 3                              # PER INSTRUMENT; six observations in total
    tasks: ["PT09", "PT10"]
    condition: "C1"
    validated_claude_code_cli_version: "2.1.229"
    governed_toolchain_cli_version: "2.1.209"
    cli_version_discrepancy: "UNRESOLVED - the governed toolchain value predates this machine's installed runtime; no version match is claimed"
    confers_no_primary_selection: true
    confers_no_confirmatory_eligibility: true
    td_b03_status: "open; unchanged by this pin"

  # SL-V2-EFF-01 - the PT01/PT04/PT07 x C1/C4 x NON_RESET/RESET efficiency
  # pilot. It REUSES the configuration SL-PT08-05 live-validated, on the same
  # machine, the same runtime and the same exact model id, with ONE deliberate
  # difference recorded below and nowhere else.
  #
  # THE DIFFERENCE: a permission allowlist for the governed CI command. Measured
  # across all nine executed live artifacts (PT08 R1-R3, PT09 R1-R3, PT10
  # R1-R3), `npm run ci:agent` was refused with "This command requires approval"
  # in all 44 attempts and executed 0 times. acceptEdits auto-approves edits
  # and leaves Bash to rule evaluation, which with no allow rule returns
  # behavior: "passthrough"; headless has nobody to ask, so the call is refused.
  # A benchmark that instructs a model to validate with a command it is then
  # refused is measuring the refusal, and the selected reset checkpoint would
  # fire on a denial rather than on a validation.
  #
  # This pin does NOT change the PT08 or PT09/PT10 configurations, which keep
  # exactly what they ran under, and does NOT re-interpret their outcomes. The
  # bearing of the finding on those packages is TD-B42 and is UNRESOLVED.
  #
  # Like the blocks above, this confers NO primary selection: TD-B03 stays open
  # and primary_model stays null.
  AFCI_EFFICIENCY_PILOT:
    decision_id: "SL-V2-EFF-01"
    primary_model_family: "Claude Sonnet"
    requested_selector: "sonnet"                # what Q1 asked for
    exact_model_id: "claude-sonnet-5"           # what the runtime resolved
    selector_used_for_repetitions: "claude-sonnet-5"   # the exact id, never the alias
    q1_readback: "PASS"
    q1_readback_sources: ["system.init.model", "modelUsage"]
    q1_unambiguous: true
    q1_validation_provenance: "SL-PT08-05; cited, not re-performed"
    q8_invalid_model_id_rejection: "PASS"
    q8_invalid_model_id: "claude-nonexistent-model-9x7q-not-a-real-id"
    q8_evidence: "exit status 1; modelUsage empty; no other model reported; assistant turn synthetic"
    q8_validation_provenance: "SL-PT08-05; cited, not re-performed"
    sterile_context_validation: "PASS"
    api_key_used: false
    authentication: "claude-code-subscription-oauth (apiKeySource=none)"
    fallback_model: "none; --fallback-model is refused by the launcher"
    permission_mode: "acceptEdits"
    tools: ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]
    # DISTINCT from `tools`: `tools` says which tools exist, this says which uses
    # of them are pre-approved. Two rules because the runtime matches exact and
    # prefix rules separately. Neither admits a different command, and neither
    # admits a compound such as `cd X && npm run ci:agent`.
    allowed_tools: ["Bash(npm run ci:agent)", "Bash(npm run ci:agent:*)"]
    allowed_tools_rationale: "SL-V2-EFF-01 section 5; all 44 prior ci:agent attempts were refused and 0 executed"
    allowed_tools_scope: "AFCI_EFFICIENCY_PILOT ONLY; PT08 and PT09/PT10 configurations are unchanged"
    repetitions: 3                              # PER (task, condition, reset state) cell
    tasks: ["PT01", "PT04", "PT07"]
    conditions: ["C1", "C4"]
    reset_states: ["NON_RESET", "RESET"]
    observations_maximum: 36
    # SL-V2-EFF-RESET-01, pilot-scoped. Resolves NO global allowance: TD-B01 and
    # TD-B11 stay open and G2 is not passed.
    pre_reset_max_turns: 32
    post_reset_max_turns: 32
    non_reset_max_turns: 64
    turn_budget_authority: "SL-V2-EFF-RESET-01"
    validated_claude_code_cli_version: "2.1.229"
    governed_toolchain_cli_version: "2.1.209"
    cli_version_discrepancy: "UNRESOLVED - the governed toolchain value predates this machine's installed runtime; no version match is claimed"
    confers_no_primary_selection: true
    confers_no_confirmatory_eligibility: true
    td_b03_status: "open; unchanged by this pin"

  # SL-V2-LOWER-MODEL-01 - the PT01/PT04/PT07 x C1/C4 x NON_RESET lower-
  # capability-model pilot. It is a NEW purpose with a NEW model, and it is the
  # first block here whose Q1 readback was performed FOR THIS BLOCK rather than
  # cited: a model pin may never inherit another model's readback.
  #
  # THE MODEL WAS NOT GUESSED. The installed runtime binary was enumerated
  # read-only first: the only Haiku-family identifiers it carries are
  # claude-haiku-4-5 / claude-haiku-4-5-20251001 and the legacy 3.x families, so
  # Haiku 4.5 is the strongest Haiku this runtime can address and nothing newer
  # could have been missed. One infrastructure-only Q1 probe then requested the
  # EXACT dated id - never the alias - and the runtime resolved exactly it.
  #
  # Q8 is CITED from SL-PT08-05, not re-performed. Invalid-model-id rejection is
  # a property of the RUNTIME, not of a model, and the runtime, the machine and
  # the CLI version are the ones it was validated on.
  #
  # Like every block above, this confers NO primary selection: TD-B03 stays open
  # and primary_model stays null. It also confers nothing on the Sonnet
  # efficiency pilot, whose configuration and outcome are untouched.
  AFCI_LOWER_MODEL_PILOT:
    decision_id: "SL-V2-LOWER-MODEL-01"
    primary_model_family: "Claude Haiku"
    requested_selector: "claude-haiku-4-5-20251001"   # the exact id, never the alias
    exact_model_id: "claude-haiku-4-5-20251001"       # what the runtime resolved
    selector_used_for_repetitions: "claude-haiku-4-5-20251001"
    model_availability_evidence: "read-only enumeration of the installed 2.1.229 runtime binary; Haiku-family ids present are claude-haiku-4-5 and claude-haiku-4-5-20251001 plus the legacy 3.x families; no Haiku 5 or newer Haiku id exists in this runtime"
    lower_capability_than_primary_candidate: true
    lower_capability_basis: "small-tier model of the preceding generation; compared against claude-sonnet-5, which the efficiency pilot ran"
    q1_readback: "PASS"
    q1_readback_sources: ["system.init.model", "modelUsage"]
    q1_unambiguous: true
    q1_validation_provenance: "SL-V2-LOWER-MODEL-01; performed live for THIS model id, not cited"
    q1_exit_status: 0
    q8_invalid_model_id_rejection: "PASS"
    q8_invalid_model_id: "claude-nonexistent-model-9x7q-not-a-real-id"
    q8_evidence: "exit status 1; modelUsage empty; no other model reported; assistant turn synthetic"
    q8_validation_provenance: "SL-PT08-05; cited, not re-performed - invalid-model-id rejection is a runtime property and the runtime is unchanged"
    sterile_context_validation: "PASS"
    api_key_used: false
    authentication: "claude-code-subscription-oauth (apiKeySource=none)"
    fallback_model: "none; --fallback-model is refused by the launcher"
    permission_mode: "acceptEdits"
    tools: ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]
    # Reused UNCHANGED from SL-V2-EFF-01 section 5. Without it the governed CI
    # surface is refused in headless mode and the run measures the refusal.
    allowed_tools: ["Bash(npm run ci:agent)", "Bash(npm run ci:agent:*)"]
    allowed_tools_rationale: "SL-V2-EFF-01 section 5, reused unchanged; TD-B42 remains open and is not resolved here"
    allowed_tools_scope: "AFCI_LOWER_MODEL_PILOT ONLY; PT08, PT09/PT10 and AFCI_EFFICIENCY_PILOT configurations are unchanged"
    repetitions: 3                              # PER (task, condition) cell
    tasks: ["PT01", "PT04", "PT07"]
    conditions: ["C1", "C4"]
    reset_states: ["NON_RESET"]
    observations_maximum: 18
    # The Sonnet pilot's NON_RESET allowance, deliberately UNCHANGED. A cheaper
    # model is not given a smaller ceiling: needing more turns is the phenomenon
    # under study, and capping it would turn that into a truncation artifact.
    non_reset_max_turns: 64
    turn_budget_authority: "SL-V2-LOWER-MODEL-01"
    validated_claude_code_cli_version: "2.1.229"
    governed_toolchain_cli_version: "2.1.209"
    cli_version_discrepancy: "UNRESOLVED - the governed toolchain value predates this machine's installed runtime; no version match is claimed"
    confers_no_primary_selection: true
    confers_no_confirmatory_eligibility: true
    pools_with_sonnet_efficiency_pilot: false
    td_b03_status: "open; unchanged by this pin"

# Model screening (CRITICAL_DESIGN_DECISIONS D10; TD-B03).
screening:
  screen_models: ["Sonnet 5", "Opus 4.8"]
  conditions_in_screening: ["C1", "C3", "C4"]   # C3 IS included in the initial screening pilot
  c2_added_for: "the selected primary model only (after its architecture content exists to token-match; TD-B08)"
  selection_criteria:
    - reliability
    - non-ceiling baseline (C1) behaviour
    - operational stability
    - useful C3 discrimination
  never_select_on: "the largest favourable AFCI (C4) effect"   # prohibited

# Runtime model-id validation remains BLOCKING before the paid pilot (D12).
dry_run_blockers:
  status: "unresolved - not performed in this work package (no runner; no paid/dry run)"
  q1_resolved_model_id_readback: "dry-run-required (MODEL_EXECUTION_CONTROLS §7 Q1; TD-B21)"
  q8_invalid_model_id_rejection: "dry-run-required (MODEL_EXECUTION_CONTROLS §7 Q8; TD-B21)"

# Execution controls are identical across conditions within a model
# (MODEL_EXECUTION_CONTROLS.md §6). Runtime-behaviour claims remain
# dry-run-required until a controlled run is performed (Q1-Q10 in that doc).
execution_controls:
  effort_input:
    mechanism: "--effort <low|medium|high|xhigh|max>"   # CLI-verified enum
    recorded_as: "input metadata only (log the flag passed)"
    recordable_from_output: "no - doc-derived; dry-run-required (Q4)"
  thinking_control_status:
    pinnable: false                              # CLI-verified (no --think/--reason flag)
    note: "adaptive and governed by effort on Opus 4.8 (doc-derived); NOT an experimental factor"
  workflow_control_status:
    disable_mechanism: "CLAUDE_CODE_DISABLE_WORKFLOWS=1 / settings disableWorkflows"  # doc-derived
    named_agents: "--agent / --agents exist"     # CLI-verified
    ultracode_in_effort_enum: false              # CLI-verified (absent from this install's enum)
    recommendation: "disable workflows for deterministic runs"

