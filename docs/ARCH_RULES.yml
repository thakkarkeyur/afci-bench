# Architecture Rules for afci-bench
# Machine-checkable rule definitions for evaluation harness
# Severity: P0 = CI blocking, P1 = Review feedback

version: "0.1.0"

rules:
  # P0 Rules - CI Blocking
  boundary_violations:
    severity: P0
    description: "Module boundary rules must be respected"
    enforcement: "@nx/enforce-module-boundaries ESLint rule"
    checks:
      - contracts_no_internal_imports:
          source: "libs/contracts"
          forbidden: ["@afci-bench/core", "@afci-bench/features", "@afci-bench/infra", "@afci-bench/observability"]
      - observability_no_internal_imports:
          source: "libs/observability"
          forbidden: ["@afci-bench/core", "@afci-bench/features", "@afci-bench/infra", "@afci-bench/contracts"]
      - core_no_infra_features:
          source: "libs/core"
          forbidden: ["@afci-bench/infra", "@afci-bench/features"]
          allowed: ["@afci-bench/contracts"]
      - features_no_infra:
          source: "libs/features"
          forbidden: ["@afci-bench/infra"]
          allowed: ["@afci-bench/core", "@afci-bench/contracts", "@afci-bench/observability"]
      - infra_no_core_features:
          source: "libs/infra"
          forbidden: ["@afci-bench/core", "@afci-bench/features"]
          allowed: ["@afci-bench/contracts", "@afci-bench/observability"]
      - api_no_core_direct:
          source: "apps/api"
          forbidden: ["@afci-bench/core"]
          allowed: ["@afci-bench/features", "@afci-bench/infra", "@afci-bench/contracts", "@afci-bench/observability"]

  test_failure:
    severity: P0
    description: "All tests must pass"
    enforcement: "npm run test"
    checks:
      - unit_tests_pass: true
      - integration_tests_pass: true

  typecheck_failure:
    severity: P0
    description: "TypeScript compilation must succeed with strict mode"
    enforcement: "npm run typecheck"
    checks:
      - strict_mode: true
      - no_implicit_any: true
      - no_errors: true

  contract_break:
    severity: P0
    description: "Contract changes must be backward compatible or versioned"
    enforcement: "Manual review + test coverage"
    checks:
      - dtos_in_contracts_only: true
      - no_adhoc_dtos_in_apps: true
      - test_coverage_for_contracts: true

  no_any_type:
    severity: P0
    description: "The 'any' type is forbidden"
    enforcement: "@typescript-eslint/no-explicit-any ESLint rule"
    checks:
      - explicit_any_banned: true

  # P1 Rules - Review Feedback
  lint_issues:
    severity: P1
    description: "Code should follow ESLint rules"
    enforcement: "npm run lint"
    checks:
      - eslint_errors: false
      - eslint_warnings: "allowed in dev, should fix"

  observability_missing_fields:
    severity: P1
    description: "Logs must include required structured fields"
    enforcement: "Code review + integration tests"
    required_request_log_fields:
      - correlationId
      - operation
      - status
      - latencyMs
    required_error_log_fields:
      - correlationId
      - errorType
      - message

  correlation_id_propagation:
    severity: P1
    description: "correlationId must be in response headers and error bodies"
    enforcement: "Integration tests"
    checks:
      - response_header_x_correlation_id: true
      - error_body_correlation_id: true

  function_complexity:
    severity: P1
    description: "Functions should be small and focused"
    enforcement: "Code review"
    checks:
      - max_lines_per_function: 50
      - single_responsibility: true

  documentation:
    severity: P1
    description: "Public APIs should have JSDoc documentation"
    enforcement: "Code review"
    checks:
      - public_functions_documented: true
      - complex_logic_commented: true

# Evaluation Metrics
metrics:
  p0_violations:
    description: "Count of P0 rule violations"
    target: 0
    blocking: true

  p1_violations:
    description: "Count of P1 rule violations"
    target: 0
    blocking: false

  test_coverage:
    description: "Percentage of code covered by tests"
    target: 80
    blocking: false

# CI Pipeline Mapping
ci_checks:
  - name: lint
    command: "npm run lint"
    rules: [boundary_violations, no_any_type, lint_issues]

  - name: typecheck
    command: "npm run typecheck"
    rules: [typecheck_failure]

  - name: test
    command: "npm run test"
    rules: [test_failure, contract_break, observability_missing_fields, correlation_id_propagation]

  - name: ci
    command: "npm run ci"
    rules: [all]
    description: "Runs lint + typecheck + test"
