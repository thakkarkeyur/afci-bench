immutability:
  statement: >-
    All v0/v1 artifacts referenced above are IMMUTABLE. No v0/v1 result, prompt,
    patch, table, figure, submitted-paper artifact, tag, release, or historical
    rerun branch may be modified, deleted, renamed, regenerated, or overwritten.
    study-v2 must not merge any rerun-v1 branch. The paper must not be edited.
    This manifest and the archive/v1 folder are additive reference records only.
  verified_additive: >-
    The v1 history from tag `paper-v0` to the rerun branch tips is composed of
    additions only (no v0/v1 files were overwritten), consistent with the
    reproducibility review of 2026-07-18.

# -----------------------------------------------------------------------------
# Known limitations of the v1 execution design (stated factually)
# -----------------------------------------------------------------------------
# Recorded so v2 is designed to remedy them. These are descriptions of the v1
# design as executed, not judgments about the v1 artifacts' integrity.
v1_execution_limitations:
  - id: L1-non-independent-runs
    statement: >-
      The harness (experiments/scripts/run_one_v1.sh) captures patch.diff as
      `git diff paper-v0` over the whole working tree and never resets the tree
      between tasks, so edits accumulate monotonically across T01..T12. Runs are
      therefore non-independent, with a single run per condition
      (48 rows = 12 tasks x 4 conditions).
  - id: L2-no-model-invocation
    statement: >-
      run_one_v1.sh does not itself invoke a model; it snapshots the working
      tree state. Model execution and diff capture are not coupled in the
      harness, limiting reproducibility of the generation step.
  - id: L3-afci-guard-nonfunctional
    statement: >-
      AFCI-Guard (afci_guard_check.py) matches literal `libs/core` import paths,
      but the codebase uses `@afci-bench/*` path aliases (tsconfig.base.json), so
      the guard regexes do not fire. conformance_summary_v1.csv is all zeros and
      the guard has no validation tests.
  - id: L4-empty-arch-rules
    statement: >-
      docs/ARCH_RULES.yml is 0 bytes on main despite documentation describing
      machine-checkable architecture rules.
  - id: L5-degenerate-metric
    statement: >-
      layer_jaccard in extract_metrics.py evaluates to a constant 1.0
      (self-comparison; expected_layers=None) yet is reported as a metric.
  - id: L6-indirect-metrics
    statement: >-
      Primary reported metrics are churn/drift (delta LOC). There is no
      per-task acceptance oracle beyond `npm run ci`, and ci_pass is saturated
      True across all 48 cells, so the gate does not discriminate task success.
  - id: L7-lockfile-desync-on-base
    statement: >-
      package-lock.json on `main` (the v1 base / tag paper-v0) is out of sync
      with package.json: `npm ci` fails on the clean base (transitive
      js-yaml and argparse version mismatch). Code-level validation still
      passes: `npm install` followed by `npm run ci` (lint + typecheck + test,
      6 projects) succeeds. A lockfile-only deterministic-install fix already
      exists at tag `paper-v0-runner` (commit 35dda1a; package.json unchanged,
      140 lines changed in package-lock.json only). The public v1 base retains
      the unsynced lockfile. study-v2 was branched leaving the v1 base
      byte-for-byte unchanged; the v2 lockfile policy is a deferred, explicit
      decision recorded under provenance.human_confirmation_todo.
    verified_on: "2026-07-19 (study-v2 init)"

